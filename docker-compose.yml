services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gestion_credito
      POSTGRES_USER: gestion_credito
      POSTGRES_PASSWORD: gestion_credito
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gestion_credito"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend/gestion.credito
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8090:8090"

  frontend:
    build: ./frontend/gestionCredito
    depends_on:
      - backend
    ports:
      - "8081:80"

volumes:
  postgres_data:
