server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /gestion-credito/api/ {
        proxy_pass http://backend:8090/gestion-credito/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
