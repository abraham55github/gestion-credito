@if (esPendiente()) {
    <div class="mt-3 grid grid-cols-2 gap-2">
        <button
            (click)="abrirRechazar()"
            class="rounded-lg border border-slate-200 py-2 text-xs font-bold text-slate-600 hover:bg-rose-50 hover:text-rose-600"
        >
            Rechazar
        </button>
        <button
            (click)="abrirAprobar()"
            class="rounded-lg bg-emerald-600 py-2 text-xs font-bold text-white hover:bg-emerald-700"
        >
            Aprobar
        </button>
    </div>
}

@if (estadoPorConfirmar(); as estado) {
    <confirmar-estado-modal
        [estado]="estado"
        [cedula]="solicitud().cedula"
        (confirmar)="confirmar($event)"
        (cancelar)="cerrarModal()"
    />
}
