    <div class="flex items-start justify-between gap-3">
        <div>
            <p class="text-sm font-bold text-slate-800">Cédula {{ solicitud().cedula }}</p>
            <p class="mt-0.5 text-xs text-slate-400">{{ solicitud().fechaCreacion | date: 'short' }}</p>
        </div>
        <span
            class="rounded-full px-2.5 py-1 text-[11px] font-bold"
            [class]="{
                'bg-amber-50 text-amber-700': solicitud().estado === 'PENDIENTE',
                'bg-emerald-50 text-emerald-700': solicitud().estado === 'APROBADA',
                'bg-rose-50 text-rose-700': solicitud().estado === 'RECHAZADA'
            }"
        >
            {{ solicitud().estado }}
        </span>
    </div>
