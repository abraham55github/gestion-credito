<div class="fixed inset-0 z-50 grid place-items-center bg-slate-950/35 p-4 backdrop-blur-[2px]">
    <button class="absolute inset-0" (click)="cancelar.emit()" aria-label="Cerrar"></button>

    <section class="relative w-full max-w-md rounded-2xl bg-white p-5 shadow-2xl">
        <div class="flex items-start justify-between">
            <div
                class="grid size-11 place-items-center rounded-xl"
                [class]="esAprobacion() ? 'bg-emerald-50 text-emerald-600' : 'bg-rose-50 text-rose-600'"
            >
                <i class="fa-solid" [class]="esAprobacion() ? 'fa-check' : 'fa-xmark'"></i>
            </div>
            <button
                (click)="cancelar.emit()"
                class="rounded-lg p-2 text-slate-400 hover:bg-slate-100"
                aria-label="Cerrar"
            >
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <h2 class="mt-4 text-lg font-bold text-slate-900">{{ titulo() }}</h2>
        <p class="mt-2 text-sm leading-relaxed text-slate-500">
            Vas a {{ esAprobacion() ? 'aprobar' : 'rechazar' }} la solicitud de la cédula
            <strong class="font-bold text-slate-700">{{ cedula() }}</strong>.
        </p>

        <label class="mt-5 block">
            <span class="mb-2 block text-xs font-bold text-slate-700">Comentario (requerido)</span>
            <textarea
                [value]="comentario()"
                (input)="actualizarComentario($any($event.target).value)"
                placeholder="Escribe una nota sobre esta decisión..."
                class="h-24 w-full resize-none rounded-xl border border-slate-200 p-3 text-sm text-slate-700 outline-none transition focus:border-blue-400 focus:ring-3 focus:ring-blue-100"
            ></textarea>
        </label>

        <div class="mt-5 grid grid-cols-2 gap-3">
            <button
                (click)="cancelar.emit()"
                class="rounded-xl border border-slate-200 py-3 text-sm font-bold text-slate-600 hover:bg-slate-50"
            >
                Cancelar
            </button>
            <button
                [disabled]="!comentario().trim()"
                (click)="onConfirmar()"
                class="rounded-xl py-3 text-sm font-bold text-white transition disabled:cursor-not-allowed disabled:opacity-40"
                [class]="esAprobacion() ? 'bg-emerald-600 hover:bg-emerald-700' : 'bg-rose-600 hover:bg-rose-700'"
            >
                Confirmar
            </button>
        </div>
    </section>
</div>
