<div class="mx-auto w-full max-w-xl py-8">
    <h1 class="text-2xl font-bold text-slate-800">Nueva solicitud de crédito</h1>

    <form [formGroup]="solicitudForm" (ngSubmit)="onSubmit()" class="mt-6 flex flex-col gap-5">
        <div>
            <label for="cedula" class="block text-sm font-semibold text-slate-700">Cédula</label>
            <input id="cedula" type="text" formControlName="cedula"
                class="mt-1 h-11 w-full rounded-lg border border-slate-300 px-3 text-sm text-slate-800 outline-none focus:border-blue-500" />
        </div>

        <div>
            <label for="monto" class="block text-sm font-semibold text-slate-700">Monto</label>
            <input id="monto" type="number" formControlName="monto"
                class="mt-1 h-11 w-full rounded-lg border border-slate-300 px-3 text-sm text-slate-800 outline-none focus:border-blue-500" />
        </div>

        <div>
            <label for="plazoMeses" class="block text-sm font-semibold text-slate-700">Plazo (meses)</label>
            <input id="plazoMeses" type="number" formControlName="plazoMeses"
                class="mt-1 h-11 w-full rounded-lg border border-slate-300 px-3 text-sm text-slate-800 outline-none focus:border-blue-500" />
        </div>

        @if (errorMensaje) {
            <p class="rounded-lg bg-rose-50 px-3 py-2 text-xs font-semibold text-rose-700">{{ errorMensaje }}</p>
        }
        @if (exito) {
            <p class="rounded-lg bg-emerald-50 px-3 py-2 text-xs font-semibold text-emerald-700">Solicitud creada correctamente.</p>
        }

        <button type="submit" [disabled]="guardando"
            class="mt-2 h-11 rounded-lg bg-blue-600 text-sm font-bold text-white transition hover:bg-blue-700 disabled:cursor-not-allowed disabled:opacity-50">
            {{ guardando ? 'Creando...' : 'Crear solicitud' }}
        </button>
    </form>
</div>
